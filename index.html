<script>window.SB_API='https://script.google.com/macros/s/AKfycbxxxrsGPeeKG4i5aVaDEv48eWVq3VnY0WgTY8EaHL4mkCTi9C5w_msYb0tu0i8s4dY6dA/exec';</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#161616;--line:#2a2a2a;--txt:#f1f1f1;--mut:#9a9a9a;--yel:#f5c400;--ok:#1fbf5b;--bad:#e5484d;--warn:#ff9f1a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Arial,sans-serif;font-size:15px}
a{color:var(--yel)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 60px}
.wide{max-width:980px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--yel) 0 14px,#111 14px 28px)}
.brand{font-family:Anton,Impact,sans-serif;font-size:30px;letter-spacing:1.5px;line-height:1;padding:12px 14px 10px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;max-width:980px;margin:auto}
.brand small{font-family:Inter;font-size:11px;letter-spacing:2px;color:var(--yel);font-weight:800}
h2{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:1px;font-size:26px;margin:18px 0 8px;text-transform:uppercase}
h3{margin:16px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.ev-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px;background:#222}
.ev-ph{width:100%;aspect-ratio:16/9;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:34px;color:#111;background:repeating-linear-gradient(-45deg,var(--yel) 0 22px,#e0b300 22px 44px);text-align:center;padding:10px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:11px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;background:var(--yel);color:#111;width:100%;font-family:Inter}
.btn.sec{background:#262626;color:var(--txt);border:1px solid #333}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:8px 11px;font-size:13px;width:auto;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:var(--txt);border-radius:10px;padding:12px;font-size:15px;font-family:Inter;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yel);border-color:transparent}
label{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tipo{display:flex;justify-content:space-between;align-items:center;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.tipo.sel{border-color:var(--yel);background:#1d1a0a}
.tipo.off{opacity:.45;cursor:default}
.price{font-weight:800;font-size:17px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.qty b{font-size:20px;min-width:24px;text-align:center}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.4px}
.p-PENDIENTE{background:#3a2d06;color:var(--yel)}.p-APROBADA,.p-VALIDA{background:#0c3a1e;color:#5ee38f}
.p-RECHAZADA,.p-ANULADA{background:#3d1214;color:#ff8a8d}.p-USADA{background:#262626;color:#bbb}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:10px 0;border-top:1px dashed #333;margin-top:6px}
.alias{font-family:monospace;font-size:19px;font-weight:800;color:var(--yel);word-break:break-all}
.msg{padding:11px 13px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.err{background:#3d1214;color:#ffb3b5}.msg.ok{background:#0c3a1e;color:#9ff0bd}.msg.info{background:#262106;color:#ffe680}
.center{text-align:center}
.qrbox{background:#fff;border-radius:16px;padding:16px;display:inline-block}
.qrbox img{width:250px;height:250px;display:block}
.code{font-family:monospace;letter-spacing:3px;font-size:18px;font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;max-width:980px;margin:auto}
.tabs button{flex:0 0 auto;border:1px solid #333;background:#181818;color:#ddd;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--yel);color:#111;border-color:var(--yel)}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px;font-family:Anton;letter-spacing:1px;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid #262626;text-align:left}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{border-radius:18px;padding:22px;text-align:center;margin:12px 0}
.res.ok{background:#0e4d27;border:2px solid var(--ok)}
.res.bad{background:#4d1214;border:2px solid var(--bad)}
.res.warn{background:#4a3205;border:2px solid var(--warn)}
.res .big{font-family:Anton;font-size:40px;letter-spacing:1px;line-height:1.1}
.res .who{font-size:22px;font-weight:800;margin-top:8px}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000}
.hide{display:none!important}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #444;border-top-color:var(--yel);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.loading{padding:50px 0;text-align:center;color:var(--mut)}
.list-item{border-bottom:1px solid #262626;padding:10px 0}
.counter{font-family:Anton;font-size:44px;letter-spacing:1px;line-height:1}
.ev-full{width:100%;height:auto;max-height:78vh;object-fit:contain;border-radius:12px;display:block;margin-bottom:12px;background:#111;cursor:zoom-in}
.sec-t{font-size:12px;letter-spacing:2.5px;color:var(--mut);font-weight:800;text-transform:uppercase;margin:22px 0 8px}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.gal img{flex:0 0 auto;width:46%;max-width:240px;aspect-ratio:4/5;object-fit:cover;border-radius:12px;scroll-snap-align:start;cursor:zoom-in;background:#1a1a1a}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.lb img{max-width:96vw;max-height:86vh;object-fit:contain;border-radius:8px}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:26px;width:46px;height:46px;border-radius:50%;cursor:pointer}
.lb .x{top:14px;right:14px}.lb .pv{left:10px;top:50%}.lb .nx{right:10px;top:50%}
.lb .cnt{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#bbb;font-size:13px}
.map{width:100%;height:230px;border:0;border-radius:12px;display:block;background:#1a1a1a}
.tipo .estado{font-size:11px;font-weight:900;letter-spacing:1px;margin-top:3px}
.tipo.off .price{text-decoration:line-through;color:var(--mut)}
.tipo.bloq{opacity:.5;cursor:default;border-style:dashed}
.p-TRANSFERIDA{background:#1d2440;color:#9db4ff}
.buybar{position:sticky;bottom:0;margin:16px -14px 0;padding:12px 14px;background:rgba(11,11,11,.96);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:4}
.buybar b{font-size:20px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="tape"></div>
  <div class="brand"><span id="brandName">SAYBEACH</span><small id="brandTag"></small></div>
</header>
<div id="tabs" class="tabs hide"></div>
<main id="app" class="wrap"><div class="loading"><span class="spin"></span></div></main>

<script>
var P = (function(){var o={};try{new URLSearchParams(location.search).forEach(function(v,k){o[k]=v})}catch(e){}return o})();
var BASE = location.origin + location.pathname;
var S = {};   // estado

/* ---------- utilidades ---------- */
function $(id){return document.getElementById(id)}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Math.round(n||0).toLocaleString('es-AR')}
var API=window.SB_API||'';
function call(fn){var args=[].slice.call(arguments,1);
  if(!API&&window.google&&google.script&&google.script.run) return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)})[fn].apply(null,args)});
  return fetch(API,{method:'POST',body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){return r.json()},function(){throw new Error('Sin conexión. Revisá internet y probá de nuevo.')})
    .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||'Error');return j.data});
}
function errMsg(e){var m=(e&&e.message)||String(e);return m.replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'')}
function render(html){$('app').innerHTML=html;window.scrollTo(0,0)}
function loading(){render('<div class="loading"><span class="spin"></span></div>')}
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||'null')} if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function qrSrc(text,size){return 'https://quickchart.io/qr?size='+(size||320)+'&margin=2&text='+encodeURIComponent(text)}
function ticketUrl(c){return BASE+'?t='+c}
function copy(t,btn){
  function done(){if(btn){var o=btn.textContent;btn.textContent='¡Copiado!';setTimeout(function(){btn.textContent=o},1400)}}
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
}
function flash(el,type,txt){el.innerHTML='<div class="msg '+type+'">'+h(txt)+'</div>'}
function fileToB64(file){
  return new Promise(function(res,rej){
    if(/^image\//.test(file.type)&&file.size>600000){
      var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){var max=1600,w=img.width,hh=img.height,r=Math.min(1,max/Math.max(w,hh));var c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(hh*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',0.82);res({name:file.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',b64:d.split(',')[1]})};
      img.onerror=function(){plain()};img.src=url;return;
    }
    plain();
    function plain(){var fr=new FileReader();fr.onload=function(){res({name:file.name,type:file.type,b64:String(fr.result).split(',')[1]})};fr.onerror=rej;fr.readAsDataURL(file)}
  });
}

/* ---------- router ---------- */
(function init(){
  try{if(window.top!==window.self)window.top.postMessage({saybeach:'ok'},'*')}catch(e){} // avisa a la página pública que la app cargó
  ['dh_puerta','dh_admin','dh_dueno'].forEach(function(k){var a=store(k);if(a&&!a.tk)store(k,null)}); // sesiones viejas (guardaban el PIN)
  if(P.t){ if(store('dh_puerta')){ puerta(P.t); } else { verTicket(P.t); } return; }
  if(P.modo==='puerta') return puerta();
  if(P.modo==='admin') return admin();
  if(P.modo==='duenos') return duenos();
  if(P.modo==='mis') return misEntradas();
  if(P.modo==='pago') return pagoRetorno(P.orden);
  venta();
})();

/* =========================================================
 * VENTA PÚBLICA
 * ========================================================= */
function venta(){
  loading();
  call('apiInicio').then(function(d){S.pub=d;$('brandName').textContent=d.app;
    var slug=String(P.e||P.evento||'').toLowerCase(),ix=-1;
    if(slug) d.eventos.forEach(function(ev,i){if(ix<0&&(ev.slug===slug||ev.slug.indexOf(slug)===0||ev.id.toLowerCase()===slug))ix=i});
    if(ix>=0) abrirEvento(ix); else listaEventos()}).catch(function(e){render('<div class="msg err">'+h(errMsg(e))+'</div>')});
}
function fechaLarga(ev){return (ev.dia?ev.dia+' ':'')+ev.fecha+(ev.hora?' · '+ev.hora+' hs':'')}
function eventoHead(ev,full){
  return (ev.imagen?'<img class="'+(full?'ev-full':'ev-img')+'" src="'+h(ev.imagen)+'" alt=""'+(full?' onclick="verFoto(-1)"':'')+'>':'<div class="ev-ph">'+h(ev.nombre)+'</div>')+
   '<div style="font-weight:800;font-size:'+(full?'22':'19')+'px">'+h(ev.nombre)+'</div>'+
   '<div class="mut sm" style="margin-top:3px">📅 '+h(fechaLarga(ev))+(ev.lugar?' · 📍 '+h(ev.lugar):'')+(ev.edadMin?' · +'+h(ev.edadMin):'')+'</div>';
}
function tiposVenta(ev){return ev.tipos.filter(function(t){return !t.agotado&&!t.bloqueado&&!t.proxima})}
function listaEventos(){
  var d=S.pub,html='<h2>Próximos eventos</h2>';
  if(!d.eventos.length) html+='<div class="card mut">No hay eventos a la venta por ahora. ¡Atentos!</div>';
  d.eventos.forEach(function(ev,i){
    var desde=tiposVenta(ev).map(function(t){return t.precio});
    html+='<div class="card">'+eventoHead(ev)+
      '<div class="row between" style="margin-top:12px"><div class="sm">'+(desde.length?'Desde <b>'+money(Math.min.apply(null,desde))+'</b>':'<b style="color:var(--bad)">AGOTADA</b>')+'</div>'+
      '<button class="btn sm" onclick="abrirEvento('+i+')">'+(desde.length?'Comprar entradas':'Ver evento')+'</button></div></div>';
  });
  html+='<p class="center sm"><a href="'+BASE+'?modo=mis" target="_top">🎟️ Ver mis entradas</a>'+(d.instagram?' · <a target="_blank" href="https://instagram.com/'+h(d.instagram)+'">Instagram</a>':'')+'</p>';
  render(html);
}
function mapsQ(ev){var m=ev.maps||'';if(/^https?:/i.test(m)){var c=m.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||m.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);return c?c[1]+','+c[2]:(ev.lugar||'')}return m||ev.lugar||''}
function mapsLink(ev){return /^https:\/\//i.test(ev.maps||'')?ev.maps:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapsQ(ev))}
function tipoHtml(t,j){
  var est='',cls='tipo',click='elegirTipo('+j+')';
  if(t.bloqueado){cls+=' bloq';click='';est='<div class="estado mut">NO DISPONIBLE POR AHORA</div>'}
  else if(t.agotado){cls+=' off';click='';est='<div class="estado" style="color:var(--bad)">AGOTADA</div>'}
  else if(t.proxima){cls+=' bloq';click='';est='<div class="estado" style="color:var(--yel)">PRÓXIMAMENTE · cuando se agote la tanda anterior</div>'}
  else if(t.quedan!=null) est='<div class="estado" style="color:var(--warn)">¡QUEDAN '+t.quedan+'!</div>';
  return '<div class="'+cls+'" id="tp'+j+'"'+(click?' onclick="'+click+'"':'')+'><div><div style="font-weight:800">'+h(t.tipo)+'</div>'+
    (t.descripcion?'<div class="mut xs">'+h(t.descripcion)+'</div>':'')+
    (t.personas>1?'<div class="mut xs">Incluye '+t.personas+' entradas</div>':'')+est+
    '</div><div class="price">'+(t.bloqueado&&!t.precio?'—':money(t.precio))+'</div></div>';
}
function abrirEvento(i){
  var ev=S.pub.eventos[i];S.ev=ev;S.sel=null;S.cant=1;
  var venta=tiposVenta(ev),desde=venta.map(function(t){return t.precio});
  var html='<p><a href="#" onclick="listaEventos();return false">← Volver</a></p>'+eventoHead(ev,true);
  if(ev.descripcion) html+='<div class="sec-t">Sobre el evento</div><div class="card" style="white-space:pre-line;line-height:1.55">'+h(ev.descripcion)+'</div>';
  html+='<div class="sec-t" id="secEntradas">Entradas</div>'+ev.tipos.map(tipoHtml).join('');
  html+='<div id="cantBox" class="card hide"><div class="row between"><b>Cantidad</b><div class="qty"><button onclick="cambiarCant(-1)">−</button><b id="cant">1</b><button onclick="cambiarCant(1)">+</button></div></div>'+
    '<div id="subtot"></div><button class="btn" style="margin-top:10px" onclick="formCompra()">Continuar</button></div>';
  if(ev.galeria&&ev.galeria.length) html+='<div class="sec-t">Galería</div><div class="gal">'+ev.galeria.map(function(u,k){return '<img src="'+h(u)+'" loading="lazy" alt="" onclick="verFoto('+k+')">'}).join('')+'</div>';
  if(mapsQ(ev)) html+='<div class="sec-t">Ubicación</div><div class="card" style="padding:10px">'+
    '<iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q='+encodeURIComponent(mapsQ(ev))+'&z=15&output=embed"></iframe>'+
    '<div class="row between" style="margin-top:10px"><div class="sm">📍 '+h(ev.lugar||mapsQ(ev))+'</div><a class="btn sm sec" style="text-decoration:none;white-space:nowrap" target="_blank" href="'+h(mapsLink(ev))+'">Cómo llegar</a></div></div>';
  if(desde.length) html+='<div class="buybar" id="buybar"><div><div class="mut xs">DESDE</div><b>'+money(Math.min.apply(null,desde))+'</b></div><button class="btn" style="width:auto" onclick="irEntradas()">Comprar entradas</button></div>';
  render(html);
}
function irEntradas(){var v=tiposVenta(S.ev);if(v.length===1&&!S.sel){elegirTipo(S.ev.tipos.indexOf(v[0]));return}$('secEntradas').scrollIntoView({behavior:'smooth',block:'start'})}
function verFoto(k){
  var fotos=(S.ev.imagen?[S.ev.imagen]:[]).concat(S.ev.galeria||[]),i=k<0?0:k+(S.ev.imagen?1:0);
  if(!fotos.length)return;
  var lb=document.createElement('div');lb.className='lb';document.body.appendChild(lb);
  function pinta(){lb.innerHTML='<img src="'+h(fotos[i])+'" alt=""><button class="x" aria-label="Cerrar">✕</button>'+(fotos.length>1?'<button class="pv">‹</button><button class="nx">›</button><div class="cnt">'+(i+1)+' / '+fotos.length+'</div>':'');
    lb.querySelector('.x').onclick=cerrar;var p=lb.querySelector('.pv'),n=lb.querySelector('.nx');
    if(p)p.onclick=function(e){e.stopPropagation();i=(i-1+fotos.length)%fotos.length;pinta()};if(n)n.onclick=function(e){e.stopPropagation();i=(i+1)%fotos.length;pinta()}}
  function cerrar(){lb.remove();document.removeEventListener('keydown',key)}
  function key(e){if(e.key==='Escape')cerrar();if(e.key==='ArrowRight'&&fotos.length>1){i=(i+1)%fotos.length;pinta()}if(e.key==='ArrowLeft'&&fotos.length>1){i=(i-1+fotos.length)%fotos.length;pinta()}}
  var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0==null||fotos.length<2)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){i=(i+(dx<0?1:-1)+fotos.length)%fotos.length;pinta()}x0=null});
  lb.addEventListener('click',function(e){if(e.target===lb)cerrar()});document.addEventListener('keydown',key);pinta();
}
function elegirTipo(j){
  S.sel=S.ev.tipos[j];S.cant=1;
  document.querySelectorAll('.tipo').forEach(function(x){x.classList.remove('sel')});$('tp'+j).classList.add('sel');
  $('cantBox').classList.remove('hide');pintarCant();$('cantBox').scrollIntoView({behavior:'smooth',block:'center'});
  var bb=$('buybar');if(bb)bb.classList.add('hide');
}

function elegirMetodo(m){

function enviarCompra(){
  var t=S.sel,n=S.cant*t.personas,m=$('fmsg');
  var d={tipoId:t.id,cantidad:S.cant,nombre:$('f_nombre').value.trim(),dni:$('f_dni').value.replace(/\D/g,''),mail:$('f_mail').value.trim(),telefono:$('f_tel').value.trim(),rrpp:'',nacimiento:$('f_nac').value,asistentes:[{}]};
  if(d.nombre.length<3||d.nombre.split(/\s+/).length<2) return flash(m,'err','Completá tu nombre y apellido.');
  if(d.dni.length<7) return flash(m,'err','Revisá el DNI.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.mail)) return flash(m,'err','Revisá el mail.');
  if(d.telefono.replace(/\D/g,'').length<8) return flash(m,'err','Completá tu celular con característica.');
  for(var i=1;i<n;i++){
    var an=$('a_n'+i).value.trim(),ad=$('a_d'+i).value.replace(/\D/g,'');
    if(an.length<3||ad.length<7) return flash(m,'err','Completá nombre y DNI de la entrada '+(i+1)+'.');
    d.asistentes.push({nombre:an,dni:ad,nac:($('a_b'+i)||{}).value||''});
  }
  var f=$('f_comp').files[0],gratis=calc().total===0,porMP=!gratis&&S.metodo==='MP';
  if(porMP){f=null;d.metodo='MP';}
  if(!f&&!gratis&&!porMP) return flash(m,'err','Subí el comprobante de la transferencia.');
  if(!$('f_ok').checked) return flash(m,'err','Tenés que aceptar las condiciones.');
  var b=$('bComprar');b.disabled=true;b.innerHTML='<span class="spin"></span> Enviando…';m.innerHTML='';
  (f?fileToB64(f):Promise.resolve(null)).then(function(c){d.comprobante=c;return call('apiComprar',d)}).then(function(r){
    if(r.checkoutUrl){
      render('<div class="card center" style="margin-top:20px"><div style="font-size:46px">💳</div><h2>Último paso: pagá</h2>'+
        '<p>Orden <b class="code" style="font-size:16px;color:var(--yel)">'+h(r.orden)+'</b> · '+money(r.total)+'</p>'+
        '<a class="btn" style="display:block;text-decoration:none;margin-top:10px" href="'+h(r.checkoutUrl)+'" target="_top">Ir a pagar con Mercado Pago</a>'+
        '<p class="mut xs" style="margin-top:12px">Tenés '+30+' minutos para pagar; después la reserva se libera.</p></div>');
      try{window.open(r.checkoutUrl,'_top')}catch(e){}
      return;
    }
    render('<div class="card center" style="margin-top:20px"><div style="font-size:46px">⏳</div><h2>¡Compra recibida!</h2>'+
      '<p>Tu número de orden es</p><div class="code" style="font-size:24px;color:var(--yel)">'+h(r.orden)+'</div>'+
      '<p class="sm">'+(r.total?'Estamos verificando la transferencia de <b>'+money(r.total)+'</b>.':'Tu pedido quedó pendiente de aprobación.')+' Cuando la aprobemos te llegan las entradas con QR a <b>'+h(d.mail)+'</b>.</p>'+
      '<p class="sm mut">Revisá también la carpeta de spam / promociones.</p>'+
      '<a class="btn" style="display:block;text-decoration:none;margin-top:14px" href="'+BASE+'?modo=mis" target="_top">Ver mis entradas</a></div>');
  }).catch(function(e){b.disabled=false;b.textContent='Enviar compra';flash(m,'err',errMsg(e))});
}

   '<label>PIN</label><input id="l_p" type="password" inputmode="numeric" autocomplete="current-password"><div id="lmsg"></div><button class="btn" id="bLog">Entrar</button>'+
   '<div class="mut xs center" style="margin-top:10px">🔒 Por seguridad, después de 5 PIN incorrectos el usuario se bloquea 15 minutos.</div></div>');
  $('bLog').onclick=function(){
    var a={u:$('l_u').value.trim().toUpperCase(),p:$('l_p').value.trim()};this.disabled=true;
    call('apiLogin',a).then(function(r){
      if(!r.ok){$('bLog').disabled=false;return flash($('lmsg'),'err',r.msg||'Usuario o PIN incorrecto.')}
      if(key==='dh_dueno'&&r.rol!=='DUENO'&&r.rol!=='ADMIN'){$('bLog').disabled=false;return flash($('lmsg'),'err','Este usuario no tiene acceso al panel de dueños.')}
      if(key==='dh_admin'&&r.rol!=='ADMIN'){$('bLog').disabled=false;return flash($('lmsg'),'err','Este usuario no es administrador.')}
      a={u:a.u,tk:r.tk,rol:r.rol};store(key,a);onOk(a);
    }).catch(function(e){$('bLog').disabled=false;flash($('lmsg'),'err',errMsg(e))});
  };
}
function salir(key){var a=store(key);store(key,null);if(a&&a.tk)call('apiLogout',a).then(function(){location.reload()},function(){location.reload()});else location.reload()}
function authFail(e,key,again){if(errMsg(e)==='AUTH'){store(key,null);again();return true}return false}

/* =========================================================
 * PUERTA
 * ========================================================= */
function puerta(codigoInicial){
  var a=store('dh_puerta')||store('dh_admin');
  if(!a) return login('dh_puerta','Puerta',function(){puerta(codigoInicial)});
  S.a=a;$('brandTag').textContent='PUERTA · '+a.u;
  loading();
  call('apiPuertaInicio',a).then(function(evs){
    S.pevs=evs;var guard=store('dh_pev');
    if(!S.pev) S.pev=(evs.filter(function(e){return e.id===guard})[0]||evs.filter(function(e){return e.estado==='ACTIVO'})[0]||evs[0]||{}).id;
    pintarPuerta();
    if(codigoInicial) consultar(codigoInicial);
  }).catch(function(e){if(!authFail(e,'dh_puerta',function(){puerta(codigoInicial)}))render('<div class="msg err">'+h(errMsg(e))+'</div>')});
}
function evPuerta(){return S.pevs.filter(function(e){return e.id===S.pev})[0]||{}}
function pintarPuerta(){
  var ev=evPuerta();
  render('<div class="card"><label>Evento</label><select id="pev" onchange="S.pev=this.value;store(\'dh_pev\',S.pev);pintarPuerta()">'+
    S.pevs.map(function(e){return '<option value="'+h(e.id)+'"'+(e.id===S.pev?' selected':'')+'>'+h(e.nombre)+' · '+h(e.fecha)+'</option>'}).join('')+'</select>'+
    '<div class="row between"><div><div class="mut xs">ADENTRO</div><div class="counter"><span id="cAd">'+(ev.adentro||0)+'</span><span class="mut" style="font-size:24px"> / <span id="cTot">'+(ev.total||0)+'</span></span></div></div>'+
    '<button class="btn sm sec" onclick="puerta()">↻</button></div></div>'+
    '<div id="pres"></div>'+
    '<label class="btn" id="bScan" style="display:block;text-align:center">📷 Escanear QR<input id="qrFoto" type="file" accept="image/*" capture="environment" style="display:none" onchange="leerFoto(this)"></label>'+
    '<div class="mut xs center" style="margin-top:6px">Se abre la cámara: sacale una foto al QR y se lee solo.</div>'+
    '<div id="reader" style="display:none"></div>'+
    '<div class="card"><label>Buscar por DNI, nombre o código</label><div class="row"><input id="pq" placeholder="Ej: 35123456" style="margin:0" onkeydown="if(event.key===\'Enter\')buscarPuerta()"><button class="btn sm" onclick="buscarPuerta()">Buscar</button></div><div id="pbus"></div></div>'+
    '<p class="center xs mut">Si la cámara no abre: escaneá el QR con la cámara del celular y abrí el link, o buscá por DNI.<br><a href="#" onclick="salir(\'dh_puerta\');return false">Cerrar sesión</a></p>');
}
function cargarLib(){
  return new Promise(function(res,rej){if(window.Html5Qrcode)return res();var s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
}
function leerFoto(inp){
  var f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  $('pres').innerHTML='<div class="loading" style="padding:20px"><span class="spin"></span> Leyendo QR…</div>';
  cargarLib().then(function(){
    S.qrf=S.qrf||new Html5Qrcode('reader');
    return S.qrf.scanFile(f,false);
  }).then(function(txt){consultar(txt)}).catch(function(){
    flash($('pres'),'err','No se pudo leer el QR. Sacá la foto más cerca y derecha, o buscá por DNI.');
  });
}
function escanear(){$('qrFoto').click()}
function consultar(code){
  if(!$('pres')) return;
  $('pres').innerHTML='<div class="loading" style="padding:20px"><span class="spin"></span></div>';
  call('apiConsultar',S.a,code).then(pintarRes).catch(function(e){flash($('pres'),'err',errMsg(e))});
}
function pintarRes(r){
  var box=$('pres'),html;
  if(!r.encontrada&&r.transferida){html='<div class="res bad"><div class="big">✖ QR VIEJO</div><div class="who">Entrada transferida</div><div class="sm">Este QR ya no sirve: la entrada ahora es de <b>'+h(r.nombre)+'</b>, que tiene un QR nuevo.</div></div>'}
  else if(!r.encontrada){html='<div class="res bad"><div class="big">✖ NO EXISTE</div><div class="sm">Código '+h(r.codigo)+'</div></div>'}
  else{
    var otroEv=r.eventoId!==S.pev;
    var datos=(r.gratis?'<div style="font-weight:900;letter-spacing:2px">🎁 INVITACIÓN</div>':'')+(r.recibida?'<div class="xs">↪️ recibida por transferencia</div>':'')+'<div class="who">'+h(r.nombre||'(sin datos)')+'</div><div>DNI <b>'+h(r.dni||'—')+'</b> · '+h(r.tipo)+'</div><div class="sm mut">'+h(r.evento)+(r.rrpp?' · RRPP '+h(r.rrpp):'')+'</div>';
    if(r.estado==='VALIDA'&&!otroEv&&r.sinDatos) html='<div class="res ok"><div class="big">✔ VÁLIDA</div>'+datos+
      '<div class="sm" style="margin-top:8px">Entrada de RRPP sin datos: cargá los de la persona.</div>'+
      '<input id="pn" placeholder="Nombre y apellido" style="margin-top:8px"><input id="pd" placeholder="DNI" inputmode="numeric" maxlength="9" style="margin-top:6px"><input id="pt" placeholder="Celular (opcional)" inputmode="tel" style="margin-top:6px">'+
      '<button class="btn" style="margin-top:12px;background:#fff;color:#0e4d27;font-size:18px" onclick="ingresar(\''+h(r.codigo)+'\',this,1)">REGISTRAR Y DAR INGRESO</button></div>';
    else if(r.estado==='VALIDA'&&!otroEv) html='<div class="res ok"><div class="big">✔ VÁLIDA</div>'+datos+'<button class="btn" style="margin-top:14px;background:#fff;color:#0e4d27;font-size:18px" onclick="ingresar(\''+h(r.codigo)+'\',this)">DAR INGRESO</button></div>';
    else if(r.estado==='USADA') html='<div class="res '+(r.recienIngresada?'ok':'bad')+'"><div class="big">'+(r.recienIngresada?'✔ ADENTRO':'✖ YA INGRESÓ')+'</div>'+datos+(r.recienIngresada?'':'<div style="margin-top:8px">Entró: <b>'+h(r.ingreso)+'</b> · controló '+h(r.controlo)+'</div>')+'</div>';
    else if(r.estado==='ANULADA') html='<div class="res bad"><div class="big">✖ ANULADA</div>'+datos+'</div>';
    else html='<div class="res warn"><div class="big">⚠ OTRO EVENTO</div>'+datos+'</div>';
  }
  box.innerHTML=html;box.scrollIntoView({behavior:'smooth',block:'start'});
  try{navigator.vibrate&&navigator.vibrate(r.encontrada&&r.estado==='VALIDA'?80:[200,100,200])}catch(e){}
}
function ingresar(code,btn,conDatos){
  var datos=null;
  if(conDatos){datos={nombre:$('pn').value.trim(),dni:$('pd').value.replace(/\D/g,''),telefono:$('pt').value.trim()};
    if(datos.nombre.split(/\s+/).length<2||datos.dni.length<7){alert('Cargá nombre, apellido y DNI.');return}}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  call('apiIngresar',S.a,code,datos).then(function(r){
    pintarRes(r);
    if(r.recienIngresada){var c=$('cAd');c.textContent=(+c.textContent||0)+1;
      $('pres').insertAdjacentHTML('beforeend','<button class="btn" onclick="escanear()">📷 Escanear siguiente</button>')}
  }).catch(function(e){btn.disabled=false;btn.textContent=conDatos?'REGISTRAR Y DAR INGRESO':'DAR INGRESO';flash($('pres'),'err',errMsg(e))});
}
function buscarPuerta(){
  var q=$('pq').value.trim();if(q.length<3)return;
  $('pbus').innerHTML='<div class="loading" style="padding:10px"><span class="spin"></span></div>';
  call('apiBuscar',S.a,q,S.pev).then(function(list){
    if(!list.length){$('pbus').innerHTML='<div class="msg info">Sin resultados en este evento.</div>';return}
    $('pbus').innerHTML=list.map(function(r){return '<div class="list-item row between"><div><b>'+h(r.nombre)+'</b><div class="mut xs">DNI '+h(r.dni||'—')+' · '+h(r.tipo)+' · '+h(r.codigo)+'</div><span class="pill p-'+h(r.estado)+'">'+h(r.estado)+'</span></div>'+
      '<button class="btn sm" onclick="consultar(\''+h(r.codigo)+'\')">Ver</button></div>'}).join('');
  }).catch(function(e){flash($('pbus'),'err',errMsg(e))});
}

var TABS=[['pend','Pendientes'],['res','Resumen'],['ev','Eventos'],['emit','Emitir'],['bus','Buscar'],['rrpp','RRPP'],['cli','Clientes'],['links','Links']];
function admin(){
  var a=store('dh_admin');
  if(!a) return login('dh_admin','Panel',admin);
  S.a=a;$('brandTag').textContent='PANEL · '+a.u;$('app').classList.add('wide');
  loading();
  call('apiAdmin',a).then(function(d){
    S.ad=d;S.tab=S.tab||'pend';
    if(!S.aev){var act=d.eventos.filter(function(e){return e.estado==='ACTIVO'});S.aev=(act[0]||d.eventos[0]||{}).id}
    pintarTabs();pintarTab();
  }).catch(function(e){if(!authFail(e,'dh_admin',admin))render('<div class="msg err">'+h(errMsg(e))+'</div>')});
}
function pintarTabs(){
  var t=$('tabs');t.classList.remove('hide');
  t.innerHTML=TABS.map(function(x){return '<button class="'+(S.tab===x[0]?'on':'')+'" onclick="S.tab=\''+x[0]+'\';pintarTabs();pintarTab()">'+x[1]+(x[0]==='pend'&&S.ad.pendientes.length?'<span class="badge">'+S.ad.pendientes.length+'</span>':'')+'</button>'}).join('')+
    '<button onclick="admin()">↻</button><button onclick="salir(\'dh_admin\')">Salir</button>';
}
function pintarTab(){({pend:tabPend,res:tabRes,ev:tabEv,emit:tabEmit,bus:tabBus,rrpp:tabRrpp,cli:tabCli,links:tabLinks})[S.tab]()}
function evSel(onch){
  return '<select onchange="S.aev=this.value;'+(onch||'pintarTab()')+'">'+S.ad.eventos.map(function(e){return '<option value="'+h(e.id)+'"'+(e.id===S.aev?' selected':'')+'>'+h(e.nombre)+' · '+h(e.fecha)+' ('+h(e.estado)+')</option>'}).join('')+'</select>';
}
function evAdmin(){return S.ad.eventos.filter(function(e){return e.id===S.aev})[0]}

function tabPend(){
  var d=S.ad,html='<h2>Compras a revisar</h2>';
  if(d.cuotaMail!=null) html+='<div class="mut xs">Mails que quedan hoy: <b>'+d.cuotaMail+'</b></div>';
  if(!d.pendientes.length) html+='<div class="card mut">No hay compras pendientes 🙌</div>';
  d.pendientes.forEach(function(o){
    html+='<div class="card" id="o_'+h(o.orden)+'"><div class="row between wrapf"><b>'+h(o.nombre)+'</b><span class="price">'+money(o.total)+'</span></div>'+
     '<div class="sm">DNI '+h(o.dni)+' · '+h(o.telefono)+' · '+h(o.mail)+'</div>'+
     '<div class="sm mut">'+h(o.orden)+' · '+h(o.fecha)+' · '+o.cantidad+' × '+h(o.tipo)+' ('+o.entradas+' entradas) · '+h(o.evento)+(o.rrpp?' · RRPP <b>'+h(o.rrpp)+'</b>':'')+'</div>'+
     '<div class="row wrapf" style="margin-top:10px">'+(o.comprobante?'<a class="btn sm sec" style="text-decoration:none" target="_blank" href="'+h(o.comprobante)+'">🧾 Ver comprobante</a>':'')+
     '<button class="btn sm ok" onclick="aprobar(\''+h(o.orden)+'\',this)">✔ Aprobar</button><button class="btn sm bad" onclick="mostrarRech(\''+h(o.orden)+'\')">✖ Rechazar</button></div>'+
     '<div id="rj_'+h(o.orden)+'" class="hide" style="margin-top:8px"><input id="rm_'+h(o.orden)+'" placeholder="Motivo (le llega por mail)" value="No encontramos la transferencia."><button class="btn sm bad" onclick="rechazar(\''+h(o.orden)+'\',this)">Confirmar rechazo</button></div>'+
     '<div id="om_'+h(o.orden)+'"></div></div>';
  });
  if(d.ultimas.length){
    html+='<h3>Últimas revisadas</h3><div class="card" style="overflow-x:auto"><table><tr><th>Orden</th><th>Nombre</th><th>Tipo</th><th class="n">Total</th><th>Estado</th><th></th></tr>'+
     d.ultimas.map(function(o){return '<tr><td class="xs">'+h(o.orden)+'<div class="mut">'+h(o.fecha)+'</div></td><td>'+h(o.nombre)+'<div class="mut xs">'+h(o.origen==='MANUAL'?'Manual':(o.origen==='MP'?'Mercado Pago'+(o.reviso==='MP'?' · automática':''):'Web'))+(o.rrpp?' · '+h(o.rrpp):'')+'</div></td><td class="sm">'+o.cantidad+' × '+h(o.tipo)+'</td><td class="n">'+money(o.total)+'</td><td><span class="pill p-'+h(o.estado)+'">'+h(o.estado)+'</span></td>'+
      '<td>'+(o.estado==='APROBADA'&&o.mail?'<button class="btn sm sec" onclick="reenviar(\''+h(o.orden)+'\',this)">Reenviar</button>':'')+'</td></tr>'}).join('')+'</table></div>';
  }
  render(html);
}
function aprobar(o,btn){
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  call('apiAprobar',S.a,o).then(function(r){
    var c=$('o_'+o);c.style.opacity=.5;flash($('om_'+o),'ok','Aprobada'+(r.mail&&r.mail.enviado?' · entradas enviadas por mail':''));
    S.ad.pendientes=S.ad.pendientes.filter(function(x){return x.orden!==o});pintarTabs();
  }).catch(function(e){btn.disabled=false;btn.textContent='✔ Aprobar';flash($('om_'+o),'err',errMsg(e))});
}
function mostrarRech(o){$('rj_'+o).classList.toggle('hide')}
function rechazar(o,btn){
  btn.disabled=true;
  call('apiRechazar',S.a,o,$('rm_'+o).value).then(function(){
    $('o_'+o).style.opacity=.5;flash($('om_'+o),'err','Rechazada');S.ad.pendientes=S.ad.pendientes.filter(function(x){return x.orden!==o});pintarTabs();
  }).catch(function(e){btn.disabled=false;flash($('om_'+o),'err',errMsg(e))});
}
function reenviar(o,btn){btn.disabled=true;call('apiReenviar',S.a,o).then(function(){btn.textContent='Enviado ✔'}).catch(function(e){btn.disabled=false;alert(errMsg(e))})}

function tablaRrpp(lista){
  if(!lista.length) return '<div class="card mut">Sin ventas todavía.</div>';
  return '<div class="card" style="overflow-x:auto"><table><tr><th>RRPP</th><th class="n">Pagas</th><th class="n">Invitaciones</th><th class="n">Entraron</th><th class="n">$</th></tr>'+
   lista.map(function(x){var tot=x.vendidas+x.regaladas;return '<tr><td><b>'+h(x.rrpp)+'</b></td><td class="n">'+x.vendidas+'</td><td class="n">'+x.regaladas+'</td><td class="n">'+x.entraron+(tot?' <span class="mut xs">('+Math.round(x.entraron/tot*100)+'%)</span>':'')+(x.sinDatos?'<div class="mut xs">'+x.sinDatos+' sin activar</div>':'')+'</td><td class="n">'+money(x.plata)+'</td></tr>'+
    (x.adentro&&x.adentro.length?'<tr><td colspan="5" style="padding-top:0"><details><summary class="sm" style="cursor:pointer;color:var(--yel)">Ver quiénes entraron ('+x.adentro.length+')</summary>'+
     '<table style="margin-top:6px">'+x.adentro.map(function(p){return '<tr><td class="sm">'+h(p.nombre)+'<div class="mut xs">DNI '+h(p.dni)+' · '+h(p.tipo)+'</div></td><td class="sm">'+(p.regalada?'<span class="pill p-PENDIENTE">INVITACIÓN</span>':'<span class="pill p-APROBADA">PAGA</span>')+'</td><td class="xs n">'+h(p.hora)+'</td></tr>'}).join('')+'</table></details></td></tr>':'')}).join('')+
   '</table><div class="mut xs" style="margin-top:6px">Pagas / Invitaciones = entradas asignadas al RRPP. Entraron = pasaron por la puerta con esa entrada.</div></div>';
}

function tablaDuenos(lista,evEstado){
  if(!lista||!lista.length) return '<div class="card mut">No hay usuarios de dueños.</div>';
  var fin=evEstado==='FINALIZADO';
  var lbl={ENTRO:['ENTRÓ','APROBADA'],NO_ENTRO:[fin?'NO FUE':'TODAVÍA NO ENTRÓ','RECHAZADA'],SIN_ACTIVAR:['SIN ACTIVAR','PENDIENTE']};
  return '<div class="card" style="overflow-x:auto"><table><tr><th>Dueño</th><th class="n">Regaló</th><th class="n">Activadas</th><th class="n">Entraron</th><th class="n">'+(fin?'No fueron':'Falta entrar')+'</th></tr>'+
   lista.map(function(x){var pct=x.regaladas?Math.round(x.entraron/x.regaladas*100):0;
    return '<tr><td><b>'+h(x.nombre)+'</b></td><td class="n">'+x.regaladas+'</td><td class="n">'+x.activadas+(x.sinActivar?'<div class="mut xs">'+x.sinActivar+' sin activar</div>':'')+'</td>'+
     '<td class="n"><b>'+x.entraron+'</b>'+(x.regaladas?' <span class="mut xs">('+pct+'%)</span>':'')+'</td><td class="n">'+x.noEntraron+'</td></tr>'+
     (x.personas.length?'<tr><td colspan="5" style="padding-top:0"><details><summary class="sm" style="cursor:pointer;color:var(--yel)">Ver sus invitados ('+x.personas.length+')</summary>'+
      '<table style="margin-top:6px">'+x.personas.map(function(p){var l=lbl[p.estado];return '<tr><td class="sm">'+h(p.nombre)+(p.dni?'<div class="mut xs">DNI '+h(p.dni)+' · '+h(p.tipo)+'</div>':'<div class="mut xs">'+h(p.tipo)+'</div>')+'</td><td><span class="pill p-'+l[1]+'">'+l[0]+'</span></td><td class="xs n">'+(p.estado==='ENTRO'?h(p.hora):'')+'</td></tr>'}).join('')+'</table></details></td></tr>':'')}).join('')+
   '</table><div class="mut xs" style="margin-top:6px">Regaló = invitaciones que generó. Activadas = la persona completó sus datos. Entraron = pasaron por la puerta.</div></div>';
}

function duenos(silent){
  var a=store('dh_dueno');
  if(!a) return login('dh_dueno','Dueños',function(){duenos()});
  S.a=a;$('brandTag').textContent='DUEÑOS';$('app').classList.add('wide');
  if(!silent) loading();
  call('apiDueno',a).then(function(d){
    S.du=d;S.duKeep=!!silent;
    if(!S.dev||!d.eventos.some(function(e){return e.id===S.dev})){var act=d.eventos.filter(function(e){return e.estado==='ACTIVO'});S.dev=(act[0]||d.eventos[0]||{}).id}
    pintarDueno();
    clearTimeout(S.duT);S.duT=setTimeout(function(){duenos(true)},60000);
  }).catch(function(e){if(!authFail(e,'dh_dueno',duenos)&&!silent)render('<div class="msg err">'+h(errMsg(e))+'</div>')});
}
function barras(items,lab,val,fmt){
  var mx=Math.max.apply(null,items.map(function(x){return x[val]}).concat([1]));
  return items.map(function(x){var w=Math.round(x[val]/mx*100);
    return '<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><div class="sm" style="width:92px;flex:none">'+h(x[lab])+'</div>'+
     '<div style="flex:1;background:rgba(255,255,255,.06);border-radius:6px;height:16px"><div style="width:'+w+'%;background:var(--yel);height:16px;border-radius:6px"></div></div>'+
     '<div class="sm n" style="width:84px;flex:none;text-align:right">'+(fmt?fmt(x[val]):x[val])+'</div></div>'}).join('');
}
function pintarDueno(){
  var d=S.du,ev=d.eventos.filter(function(e){return e.id===S.dev})[0];
  var top='<div class="row between wrapf"><h2 style="margin:0">Control del evento</h2><div class="row"><button class="btn sm" onclick="regalos()">🎁 Regalar invitaciones</button><button class="btn sm sec" onclick="duenos()">↻ Actualizar</button><button class="btn sm sec" onclick="salir(\'dh_dueno\')">Salir</button></div></div>'+
    '<div class="mut xs" style="margin:4px 0 10px">'+h(d.usuario)+' · actualizado '+h(d.ahora)+' · se actualiza solo cada 1 minuto</div>';
  if(!ev){render(top+'<div class="card mut">Todavía no hay eventos.</div>');return}
  var r=ev.resumen,cap=r.capacidad,pct=cap?Math.round(r.entradas/cap*100):null;
  var html=top+'<select onchange="S.dev=this.value;pintarDueno()">'+d.eventos.map(function(e){return '<option value="'+h(e.id)+'"'+(e.id===S.dev?' selected':'')+'>'+h(e.nombre)+' · '+h(e.fecha)+' ('+h(e.estado)+')</option>'}).join('')+'</select>'+
    '<div class="mut sm" style="margin:6px 0 12px">'+h(ev.fecha)+' · '+h(ev.hora)+' · '+h(ev.lugar)+'</div>'+
    '<div class="kpis">'+
    '<div class="kpi"><span class="mut xs">RECAUDADO</span><b>'+money(r.recaudado)+'</b></div>'+
    '<div class="kpi"><span class="mut xs">ENTRADAS VENDIDAS</span><b>'+r.entradas+(cap?' / '+cap:'')+'</b>'+(pct!=null?'<span class="mut xs">'+pct+'% de la capacidad</span>':'')+'</div>'+
    '<div class="kpi"><span class="mut xs">ADENTRO AHORA</span><b>'+r.adentro+'</b><span class="mut xs">de '+r.emitidas+' entradas emitidas</span></div>'+
    '<div class="kpi"><span class="mut xs">COMPRAS</span><b>'+r.compras+'</b><span class="mut xs">ticket promedio '+money(r.compras?r.recaudado/r.compras:0)+'</span></div></div>'+
    '<h3>Por tipo de entrada</h3><div class="card" style="overflow-x:auto"><table><tr><th>Tipo</th><th class="n">Precio</th><th class="n">Vendidas</th><th class="n">Cupo</th><th class="n">Adentro</th><th class="n">$</th></tr>'+
    ev.tipos.map(function(t){return '<tr><td>'+h(t.tipo)+(t.personas>1?' <span class="mut xs">(x'+t.personas+')</span>':'')+(t.activo?'':' <span class="mut xs">(cerrada)</span>')+'</td><td class="n">'+money(t.precio)+'</td><td class="n">'+t.vendidas+'</td><td class="n">'+(t.cupo||'∞')+'</td><td class="n">'+t.adentro+'</td><td class="n">'+money(t.plata)+'</td></tr>'}).join('')+'</table></div>'+
    '<h3>🎁 Invitaciones de los dueños</h3>'+tablaDuenos(r.duenos,ev.estado)+
    '<h3>RRPP</h3>'+tablaRrpp(r.rrpp)+
    '<h3>Ventas por día</h3><div class="card">'+(r.dias.length?barras(r.dias.map(function(x){return {dia:x.dia.slice(8,10)+'/'+x.dia.slice(5,7),entradas:x.entradas}}),'dia','entradas'):'<div class="mut">Sin ventas todavía</div>')+'</div>'+
    '<h3>Ingresos a la fiesta por hora</h3><div class="card">'+(r.horas.length?barras(r.horas,'hora','cant'):'<div class="mut">Todavía no entró nadie.</div>')+'</div>'+
    '<h3>Cómo se vendió</h3><div class="card" style="overflow-x:auto"><table><tr><th>Medio</th><th class="n">Entradas</th><th class="n">$</th></tr>'+
    (r.origen.length?r.origen.map(function(x){return '<tr><td>'+h(x.origen)+'</td><td class="n">'+x.entradas+'</td><td class="n">'+money(x.plata)+'</td></tr>'}).join(''):'<tr><td colspan="3" class="mut">Sin ventas todavía</td></tr>')+'</table></div>'+
    '<h3>Últimas ventas</h3><div class="card" style="overflow-x:auto"><table><tr><th>Fecha</th><th>Nombre</th><th>Tipo</th><th class="n">Total</th><th>RRPP</th></tr>'+
    (ev.ultimas.length?ev.ultimas.map(function(o){return '<tr><td class="xs">'+h(o.fecha)+'</td><td>'+h(o.nombre)+'<div class="mut xs">'+h(o.origen)+'</div></td><td class="sm">'+o.cantidad+' × '+h(o.tipo)+'</td><td class="n">'+money(o.total)+'</td><td class="sm">'+h(o.rrpp||'—')+'</td></tr>'}).join(''):'<tr><td colspan="5" class="mut">Sin ventas todavía</td></tr>')+'</table></div>'+
    (r.pendientes?'<div class="mut xs">Hay '+r.pendientes+' compra(s) iniciadas sin pagar todavía (no se cuentan).</div>':'');
  var y=window.scrollY;render(html);if(S.duKeep){window.scrollTo(0,y);S.duKeep=false}
}

function regalos(){
  clearTimeout(S.duT);loading();
  call('apiMisRegalos',S.a).then(pintarRegalos).catch(function(e){if(!authFail(e,'dh_dueno',duenos))render('<div class="msg err">'+h(errMsg(e))+'</div>')});
}
function pintarRegalos(d,recien){
  S.rg=d;var evs=d.eventos;
  var html='<p><a href="#" onclick="duenos();return false">← Volver al control</a></p><h2>🎁 Regalar invitaciones</h2>'+
   '<div class="mut sm">Cada dueño puede regalar hasta <b>'+((d.eventos[0]||{}).topes||{comunes:{tope:100}}).comunes.tope+' comunes</b> y <b>'+((d.eventos[0]||{}).topes||{vip:{tope:25}}).vip.tope+' VIP</b> por evento. Generás invitaciones sin costo. Te quedan los links para mandar por WhatsApp: cada persona completa sus datos con su link (o en la puerta) y le llega el QR. En las estadísticas figuran a tu nombre.</div>';
  if(!evs.length) html+='<div class="card mut" style="margin-top:12px">No hay eventos a la venta.</div>';
  else html+='<div class="card" style="margin-top:12px"><label>Evento</label><select id="rg_e">'+evs.map(function(e,i){return '<option value="'+i+'">'+h(e.nombre)+' · '+h(e.fecha)+'</option>'}).join('')+'</select>'+
   '<div id="rg_tope" class="kpis" style="margin:8px 0"></div>'+
   '<label>Tipo de entrada</label><select id="rg_t"></select><label>Cantidad</label><input id="rg_c" inputmode="numeric" value="1">'+
   '<div id="rgmsg"></div><button class="btn" id="bRg">Generar invitaciones</button></div>';
  var L=d.regalos.filter(function(e){return e.estado!=='ANULADA'}),libres=L.filter(function(e){return e.estado==='SIN DATOS'&&e.link});
  var txt='¡Te regalo una invitación para '+(L[0]?L[0].evento:'')+'! Abrí el link y completá tus datos:\n'+libres.map(function(e,j){return (libres.length>1?(j+1)+') ':'')+e.link}).join('\n');
  html+='<h3>Mis invitaciones</h3><div class="card">'+(recien?'<div class="msg ok">Invitaciones generadas ✔ Mandá los links.</div>':'')+
   (L.length?'<div class="mut xs" style="margin-bottom:8px">'+L.length+' regaladas · '+L.filter(function(e){return e.estado==='SIN DATOS'}).length+' sin activar · '+L.filter(function(e){return e.estado==='CON DATOS'}).length+' con datos · <b>'+L.filter(function(e){return e.estado==='ENTRÓ'}).length+' entraron</b></div>'+
    (libres.length?'<div class="row wrapf" style="margin-bottom:10px"><a class="btn sm ok" style="text-decoration:none" target="_blank" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Mandar links sin usar por WhatsApp ('+libres.length+')</a><button class="btn sm sec" id="bRgCp">Copiar links</button></div>':'')+
    '<div style="overflow-x:auto;max-height:420px;overflow-y:auto"><table><tr><th>Invitación</th><th>Estado</th><th>Persona</th><th></th></tr>'+L.map(function(e){
      return '<tr><td class="xs">'+h(e.tipo)+'<div class="mut">'+h(e.evento)+'</div></td><td><span class="pill p-'+(e.estado==='ENTRÓ'?'APROBADA':(e.estado==='CON DATOS'?'USADA':'PENDIENTE'))+'">'+h(e.estado)+'</span></td>'+
       '<td class="sm">'+h(e.nombre||'—')+(e.dni?'<div class="mut xs">DNI '+h(e.dni)+'</div>':'')+'</td><td>'+(e.link&&e.estado==='SIN DATOS'?'<a class="btn sm sec" style="text-decoration:none" target="_blank" href="https://wa.me/?text='+encodeURIComponent('¡Te regalo una invitación para '+e.evento+'! Abrí el link y completá tus datos: '+e.link)+'">WhatsApp</a>':'')+'</td></tr>'}).join('')+'</table></div>'
   :'<div class="mut">Todavía no regalaste invitaciones.</div>')+'</div>';
  render(html);
  var b=$('bRgCp');if(b)b.onclick=function(){copy(txt,this)};
  if(!evs.length)return;
  var pinta=function(){var ev=evs[+$('rg_e').value],tp=ev.topes;
    $('rg_tope').innerHTML='<div class="kpi"><span class="mut xs">COMUNES · TE QUEDAN</span><b>'+tp.comunes.quedan+'</b><span class="mut xs">regalaste '+tp.comunes.usadas+' de '+tp.comunes.tope+'</span></div>'+
      '<div class="kpi"><span class="mut xs">VIP · TE QUEDAN</span><b>'+tp.vip.quedan+'</b><span class="mut xs">regalaste '+tp.vip.usadas+' de '+tp.vip.tope+'</span></div>';
    $('rg_t').innerHTML=ev.tipos.map(function(t){return '<option value="'+h(t.id)+'">'+h(t.tipo)+(t.personas>1?' (x'+t.personas+')':'')+(t.vip?' · VIP':'')+(t.quedan!=null?' · quedan '+t.quedan:'')+'</option>'}).join('')};
  $('rg_e').onchange=pinta;pinta();
  $('bRg').onclick=function(){
    var c=parseInt($('rg_c').value,10),m=$('rgmsg'),ev=evs[+$('rg_e').value],t=ev.tipos.filter(function(x){return x.id===$('rg_t').value})[0]||{},tp=t.vip?ev.topes.vip:ev.topes.comunes;
    if(!(c>=1))return flash(m,'err','Poné una cantidad.');
    if(c*(t.personas||1)>tp.quedan)return flash(m,'err','Te quedan '+tp.quedan+' invitaciones '+(t.vip?'VIP':'comunes')+' para este evento (tope '+tp.tope+').');
    var t=$('rg_t').options[$('rg_t').selectedIndex].text;if(!confirm('¿Generar '+c+' invitación(es) de '+t+'?'))return;
    var bt=this;bt.disabled=true;bt.innerHTML='<span class="spin"></span>';
    call('apiRegalarDueno',S.a,{tipoId:$('rg_t').value,cantidad:c}).then(function(d){pintarRegalos(d,true)}).catch(function(e){bt.disabled=false;bt.textContent='Generar invitaciones';flash(m,'err',errMsg(e))});
  };
}

function tabCli(){
  render('<h2>Clientes · historial</h2><div class="card"><label>Buscar por DNI o nombre</label><div class="row"><input id="c_q" placeholder="Ej: 35123456 o Perez"><button class="btn sm" id="bCq" style="width:auto">Buscar</button></div><div id="cres"></div></div><div id="cext"><div class="loading"><span class="spin"></span></div></div>');
  var buscar=function(){var q=$('c_q').value.trim();if(q.length<3)return flash($('cres'),'err','Escribí al menos 3 letras o números.');$('cres').innerHTML='<div class="loading"><span class="spin"></span></div>';
    call('apiClientes',S.a,q).then(function(d){$('cres').innerHTML=d.resultados.length?d.resultados.map(fichaCli).join(''):'<div class="mut" style="margin-top:8px">No hay nadie con ese DNI o nombre.</div>'}).catch(function(e){flash($('cres'),'err',errMsg(e))})};
  $('bCq').onclick=buscar;$('c_q').onkeydown=function(e){if(e.key==='Enter')buscar()};
  call('apiClientes',S.a,'').then(function(d){
    $('cext').innerHTML='<div class="kpis"><div class="kpi"><span class="mut xs">PERSONAS EN EL HISTORIAL</span><b>'+d.total+'</b></div><div class="kpi"><span class="mut xs">CON FECHA DE NACIMIENTO</span><b>'+d.conNac+'</b></div></div>'+
     '<h3>🎂 Cumpleaños próximos (15 días)</h3><div class="card" style="overflow-x:auto">'+(d.cumple.length?'<table><tr><th>Nombre</th><th>Cumple</th><th class="n">Edad</th><th>Celular</th><th class="n">Eventos</th></tr>'+d.cumple.map(function(c){return '<tr><td>'+h(c.nombre)+'<div class="mut xs">DNI '+h(c.dni)+'</div></td><td>'+h(c.cumple)+(c.dias===0?' <b>¡HOY!</b>':' <span class="mut xs">(en '+c.dias+' días)</span>')+'</td><td class="n">'+(c.edad!==''?c.edad+1-(c.dias===0?1:0):'')+'</td><td class="sm">'+h(c.tel||'—')+'</td><td class="n">'+c.eventos+'</td></tr>'}).join('')+'</table>':'<div class="mut">Nadie cumple en los próximos 15 días (o todavía no cargaron la fecha).</div>')+'</div>'+
     '<h3>⭐ Los que más vienen</h3><div class="card" style="overflow-x:auto"><table><tr><th>Nombre</th><th class="n">Eventos</th><th class="n">Fue</th><th class="n">Gastó</th><th>Último</th></tr>'+
     (d.frecuentes.length?d.frecuentes.map(function(c){return '<tr><td>'+h(c.nombre)+'<div class="mut xs">DNI '+h(c.dni)+(c.rrpp?' · '+h(c.rrpp):'')+'</div></td><td class="n">'+c.eventos+'</td><td class="n">'+c.asistio+'</td><td class="n">'+money(c.gastado)+'</td><td class="sm">'+h(c.ultima)+'</td></tr>'}).join(''):'<tr><td colspan="5" class="mut">Todavía no hay datos.</td></tr>')+'</table></div>'+
     '<div class="mut xs">Todo esto también queda en la hoja CLIENTES de la planilla (una fila por DNI, se actualiza sola).</div>';
  }).catch(function(e){$('cext').innerHTML='<div class="msg err">'+h(errMsg(e))+'</div>'});
}
function fichaCli(c){
  return '<div class="card" style="margin-top:10px"><div class="row between wrapf"><div><b>'+h(c.nombre)+'</b><div class="mut sm">DNI '+h(c.dni)+(c.nac?' · nació '+h(c.nac)+' ('+c.edad+' años)':'')+'</div><div class="mut sm">'+h(c.mail||'')+(c.tel?' · '+h(c.tel):'')+'</div></div>'+
   '<div class="sm" style="text-align:right">'+c.eventos+' evento(s) · fue a '+c.asistio+'<div class="mut xs">'+c.entradas+' entradas · gastó '+money(c.gastado)+'</div></div></div>'+
   '<table style="margin-top:8px"><tr><th>Evento</th><th>Tipo</th><th>RRPP</th><th>¿Fue?</th></tr>'+(c.detalle||[]).map(function(x){return '<tr><td class="sm">'+h(x.evento)+'<div class="mut xs">'+h(x.fecha)+'</div></td><td class="sm">'+h(x.tipo)+(x.regalada?' <span class="mut xs">(invitación)</span>':'')+'</td><td class="sm">'+h(x.rrpp||'—')+'</td><td class="sm">'+(x.asistio?'✔ '+h(x.ingreso):'✘')+'</td></tr>'}).join('')+'</table></div>';
}

function tabLinks(){
  var L=[['Venta (todos los eventos)',BASE]].concat(S.ad.eventos.filter(function(e){return e.estado==='ACTIVO'}).map(function(e){return ['Venta '+e.nombre,BASE+'?e='+e.slug]})).concat([['Mis entradas',BASE+'?modo=mis'],['Puerta (escáner)',BASE+'?modo=puerta'],['Panel admin',BASE+'?modo=admin'],['Panel dueños (solo ver)',BASE+'?modo=duenos']]);
  render('<h2>Links</h2><div class="card">'+L.map(function(l){return '<div class="list-item"><div class="row between wrapf"><b>'+l[0]+'</b><div class="row"><a class="btn sm sec" style="text-decoration:none" target="_blank" href="'+h(l[1])+'">Abrir</a><button class="btn sm" onclick="copy(\''+h(l[1])+'\',this)">Copiar</button></div></div><div class="mut xs" style="word-break:break-all">'+h(l[1])+'</div></div>'}).join('')+'</div>'+
   '<div class="card sm mut">El cargo por servicio, el link público (URL_PUBLICA) y si se pueden transferir entradas (TRANSFERENCIAS) se cambian en la hoja CONFIG. Los PIN, en la hoja USUARIOS: al cambiar un PIN se cierran solas las sesiones abiertas de ese usuario.</div>');
}
