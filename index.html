<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SAYBEACH · Entradas</title>
<meta name="description" content="Entradas para las fiestas de Say Beach - Costanera Este, Santa Fe.">
<meta property="og:title" content="SAYBEACH · Entradas">
<meta property="og:description" content="Comprá tus entradas para las fiestas de Say Beach.">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1KKlj3Er8C41muKqPxC-LEqthxZYlRF_e=w1200">
<meta name="theme-color" content="#0b0b0b">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0b0b;color:#f5c400;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:transparent}
  #wait{position:fixed;inset:0;z-index:5;background:#0b0b0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  #wait b{font-size:26px;letter-spacing:2px}
  #wait .sp{width:34px;height:34px;border:3px solid rgba(245,196,0,.25);border-top-color:#f5c400;border-radius:50%;animation:g 1s linear infinite}
  #wait a{color:#f5c400;font-size:14px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!--
  SAYBEACH — página pública de la ticketera.
  Muestra la app de Apps Script adentro de esta página (así no aparece el cartel de Google).
  Desde Instagram/Facebook/TikTok (que no muestran la app) manda a abrir en Safari o Chrome.
  Si en el navegador normal no carga en 12 s, abre la app directo.
-->
<div id="wait"><b>SAYBEACH</b><div class="sp"></div><div id="msg" style="font-size:14px;color:#bbb">Cargando…</div></div>
<div id="ext" style="display:none;position:fixed;inset:0;z-index:6;background:#0b0b0b;color:#fff;padding:28px 22px;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <b style="color:#f5c400;font-size:28px;letter-spacing:2px">SAYBEACH</b>
  <div style="font-size:19px;font-weight:700">Abrí las entradas en tu navegador</div>
  <div style="font-size:15px;color:#ccc;max-width:340px;line-height:1.45">Instagram no deja comprar desde adentro de la app. Tocá el botón para abrir la página en <span id="nav">Safari</span>.</div>
  <a id="bAbrir" href="#" style="display:block;background:#f5c400;color:#111;font-weight:800;font-size:17px;padding:15px 26px;border-radius:12px;text-decoration:none">Abrir en <span id="nav2">Safari</span></a>
  <div id="pasos" style="font-size:14px;color:#aaa;max-width:340px;line-height:1.5">Si no se abre: tocá <b style="color:#fff">···</b> arriba a la derecha y elegí <b style="color:#fff">“Abrir en el navegador”</b> (o “Abrir en Safari”).</div>
  <a id="bCopiar" href="#" style="color:#f5c400;font-size:14px">Copiar link</a>
</div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbxxxrsGPeeKG4i5aVaDEv48eWVq3VnY0WgTY8EaHL4mkCTi9C5w_msYb0tu0i8s4dY6dA/exec';
  var DEST = EXEC + (location.search || '');
  var ua = navigator.userAgent || '';
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Line\/|TikTok|musical_ly|Bytedance|Snapchat|Twitter/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  function directo() { location.replace(DEST); }
  if (inApp) {
    // Los navegadores internos (Instagram, Facebook, TikTok...) no muestran la app: la abrimos en Safari / Chrome
    document.getElementById('wait').style.display = 'none';
    var ext = document.getElementById('ext'); ext.style.display = 'flex';
    var aqui = location.href;
    var salto;
    if (android) {
      document.getElementById('nav').textContent = 'Chrome'; document.getElementById('nav2').textContent = 'Chrome';
      salto = 'intent://' + aqui.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(DEST) + ';end';
    } else if (ios) {
      salto = 'x-safari-' + aqui;
    } else {
      salto = DEST;
    }
    document.getElementById('bAbrir').href = salto;
    document.getElementById('bCopiar').onclick = function (e) {
      e.preventDefault();
      try { navigator.clipboard.writeText(aqui); this.textContent = '¡Link copiado! Pegalo en Safari o Chrome'; }
      catch (err) { prompt('Copiá este link y abrilo en tu navegador:', aqui); }
    };
    setTimeout(function () { location.href = salto; }, 400);
  } else {
    var ok = false;
    window.addEventListener('message', function (e) {
      if (e.data && e.data.saybeach === 'ok') { ok = true; document.getElementById('wait').style.display = 'none'; }
    });
    var f = document.createElement('iframe');
    f.id = 'app'; f.title = 'SAYBEACH';
    f.allow = 'camera; clipboard-read; clipboard-write; fullscreen; payment';
    f.src = DEST;
    document.body.appendChild(f);
    setTimeout(function () {
      if (!ok) document.getElementById('msg').innerHTML = 'Está tardando… <a href="' + DEST + '">tocá acá para abrir</a>';
    }, 6000);
    setTimeout(function () { if (!ok) directo(); }, 12000);
  }
</script>
</body>
</html>
